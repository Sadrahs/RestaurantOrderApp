<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Restaurant Order</title>
        <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&family=Sue+Ellen+Francisco&display=swap" rel="stylesheet">
     
        <link rel="stylesheet" href="index.css">
    </head>

    <body>
        <header class="hero">
        <img src="images/hero-bg.png" alt="hero-bg" class="hero-bg">
                <h1 class="hero-text"> Sadra's Diner </h1>
                <h2 class="hero-subtext">The best burgers and pizzas in town.</h2>
        </header>

        <section class="menu-container" id="menu-contatiner">

        </section>

        <section class="orders" id = "orders">
            <h2 class="orders-title">Your Orders</h2>
            <div class="orderBox" id = "orderBox">
                <div class= "orderItem" id="orderItem">
                </div> 
            </div>
            <div class="total-price">
                <p class="total-price-text">Total Price: </p>
                <p class="total-price-value" id="total-price-value"></p>
            </div>
            <button class="complete-order-btn" id="complete-order-btn" data-complete="complete">Complete Order</button>



        </section>
        

        <section class="payment-details hidden" id="payment-details">
            <h2 class="payment-title">Enter Card Details</h2>
            <form class="payment-form" id="payment-form">

                <lable for="name">Name</lable>
                <input type="text" id ="name" name="name" required placeholder="Enter your name">
                <lable for="card-number">Card number</lable>
                <input type="text" id ="card-number" name="card-number" required placeholder=" Enter your card number">
                <lable for="cvv">CVV</lable>
                <input type="text" id ="cvv" name="cvv" required placeholder="Enter your CVV">                    
            </form>
            <button class="pay-btn" id="pay-btn">Pay</button>
        </section>

        <section class="thank-you hidden" id="thank-you">
            <h2 class="thank-you-title">Thank you for your order!</h2>
            <p class="thank-you-text">Your order is being prepared and will be ready soon.</p>
        </section>


        <footer>

        </footer>




    </body>



    <script type="module" src="index.js"></script>


</html>
